# Odoo 17 local para `python -m resurtido.odoo` (opcional; ver README).
# Primer arranque: crea la base `sautek` e instala Compras + Inventario. Tarda unos minutos.
name: sautek-odoo

services:
  web:
    image: odoo:17.0
    command: odoo -d sautek -i purchase_stock --without-demo=all --db-filter=^sautek$
    depends_on:
      - db
    ports:
      - "8070:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
