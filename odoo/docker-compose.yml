# Odoo 17 local (opcional; ver README). La imagen se construye con odoo/Dockerfile y
# monta el paquete `resurtido` para que Odoo use el mismo motor que la CLI.
# Primer arranque: crea la base `sautek` e instala Compras + Inventario, el seguimiento de
# compras y la importación del Excel (addons/). Tarda unos minutos.
# Correo de prueba: Odoo envía y recibe por GreenMail; el webmail Roundcube (http://localhost:8000)
# deja entrar como el proveedor o el comprador. Nada sale a internet.
name: sautek-odoo

services:
  web:
    build:
      context: ..
      dockerfile: odoo/Dockerfile
    image: sautek-odoo:17.0
    command: >-
      odoo -d sautek -i purchase_stock,purchase_supply_tracking,purchase_excel_replenishment,purchase_quote_reader,sautek_demo_mail
      --without-demo=all --db-filter=^sautek$ --smtp greenmail --smtp-port 3025
    depends_on:
      - db
      - greenmail
    ports:
      - "8070:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ../resurtido:/mnt/resurtido/resurtido:ro
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PYTHONPATH=/mnt/resurtido
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  greenmail:
    image: greenmail/standalone
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    restart: unless-stopped

  webmail:
    image: roundcube/roundcubemail
    depends_on:
      - greenmail
    ports:
      - "8000:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=greenmail
      - ROUNDCUBEMAIL_DEFAULT_PORT=3143
      - ROUNDCUBEMAIL_SMTP_SERVER=greenmail
      - ROUNDCUBEMAIL_SMTP_PORT=3025
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
    volumes:
      - ./roundcube/smtp.php:/var/roundcube/config/smtp.php:ro
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
