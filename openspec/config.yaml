schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: prueba técnica "Coordinación de procesos y desarrollo" (caso Ferretera Garza).
  Programa de resurtido semanal que lee data/inventario_ferreteria_garza.xlsx
  (hojas Existencias, Minimos, Producto_Proveedor, Proveedores; encabezado en la fila 2)
  y genera: pedidos por proveedor (Excel/CSV), borradores de correo (no se envían)
  y un reporte de excepciones.
  Stack: Python 3 con pandas y openpyxl. Debe correr en otra computadora siguiendo el README.
  Regla central: el programa no truena ni descarta registros en silencio;
  todo registro no procesable va al reporte de excepciones con la decisión tomada.
  Código, nombres y commits en inglés; documentación y salidas para el usuario en español.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
